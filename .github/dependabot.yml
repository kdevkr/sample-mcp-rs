version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /auth
    schedule:
      interval: weekly
    ignore:
      # 타입은 CI·README의 Node 24에 맞춘다. Node를 올릴 때 함께 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    # 루트는 워크플로만 본다. 로컬 composite 액션의 고정 SHA도 함께 올린다.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
