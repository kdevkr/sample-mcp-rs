name: Prepare servers
description: 인가 서버 의존성을 설치하고 mcp-server를 빌드한다. 서버 기동은 .github/start-servers.sh로 한다.
runs:
  using: composite
  steps:
    - run: rustup toolchain install stable --profile minimal && rustup default stable
      shell: bash
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: auth/pnpm-lock.yaml
    - run: pnpm -C auth install --frozen-lockfile
      shell: bash
    - run: cargo build -p mcp-server --locked
      shell: bash
