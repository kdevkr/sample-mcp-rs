name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# PR에 새로 푸시하면 이전 실행을 취소한다. master는 커밋마다 끝까지 돌린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - run: pnpm -C auth audit

  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: auth/pnpm-lock.yaml
      - run: pnpm -C auth install --frozen-lockfile
      - run: pnpm -C auth typecheck

  # 인가 서버와 MCP 서버 두 개(aud 검증용)를 띄워 실제 토큰으로 확인한다.
  e2e:
    needs: [rust, auth]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_ISSUER: http://localhost:4000
      MCP_RESOURCE_URL: http://localhost:3000/mcp
      OTHER_MCP_URL: http://localhost:3001/other
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: auth/pnpm-lock.yaml
      - run: pnpm -C auth install --frozen-lockfile
      - run: cargo build -p mcp-server --locked
      - name: Start servers
        run: |
          pnpm -C auth start > auth.log 2>&1 &
          ./target/debug/mcp-server > mcp.log 2>&1 &
          PORT=3001 MCP_RESOURCE_URL=$OTHER_MCP_URL ./target/debug/mcp-server > other.log 2>&1 &
          for url in $AUTH_ISSUER/.well-known/openid-configuration \
                     http://localhost:3000/.well-known/oauth-protected-resource \
                     http://localhost:3001/.well-known/oauth-protected-resource; do
            curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null "$url"
          done
      - run: pnpm -C auth e2e
      - if: failure()
        run: tail -n 50 auth.log mcp.log other.log
