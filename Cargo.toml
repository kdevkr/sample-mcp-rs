[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
# 의존성 중 uuid가 1.89를 요구한다. 낮은 버전에서는 문법 오류 대신 이 버전을 알려준다.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
jsonwebtoken = { version = "11", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Lambda 배포용. 바이너리를 줄여 업로드·콜드 스타트 부담을 낮춘다.
[profile.release]
lto = true
codegen-units = 1
strip = true
